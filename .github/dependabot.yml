version: 2
updates:
  # Major updates will not be grouped together for github-actions updates
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Every other monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Major updates will not be grouped together for npm updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Every other monday at 08:00
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    target-branch: "main"
